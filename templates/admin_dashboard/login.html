<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ThreadFusion</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 50%, #f5f5f7 0%, #d2d2d7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .login-brand {
            font-weight: 900;
            font-size: 1.6rem;
            color: #0071e3;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .form-control {
            border-radius: 14px;
            padding: 0.85rem 1.25rem;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .btn-primary {
            background-color: #0071e3;
            border: none;
            border-radius: 14px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0077ed;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="/" class="text-decoration-none">
            <div class="login-brand">
                <i class="fa-solid fa-gem"></i> ThreadFusion
            </div>
        </a>
        
        <h4 class="fw-bold mb-1 text-dark">Business Dashboard</h4>
        <p class="text-secondary small mb-4">Access limited to authorized business administrators.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 px-3 small rounded-3 mb-4 text-start" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-dark">Username</label>
                <input type="text" name="username" required class="form-control" placeholder="Enter username...">
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold text-dark">Password</label>
                <input type="password" name="password" required class="form-control" placeholder="Enter password...">
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm mt-2">
                <i class="fa-solid fa-shield-halved me-2"></i> Log In to Operations
            </button>
        </form>
    </div>

</body>
</html>
